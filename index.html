<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>다나와자동차 카드 생성기</title>
<meta name="description" content="다나와자동차 카카오채널 주간 소식 카드 생성기">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; background: #ECEEF2; min-height: 100vh; }
  .app { display: grid; grid-template-columns: 400px 1fr; min-height: 100vh; }

  .input-panel { background: #fff; border-right: 1px solid #E2E8F0; display: flex; flex-direction: column; height: 100vh; position: sticky; top: 0; }
  .ip-header { padding: 18px 22px 14px; border-bottom: 1px solid #F1F5F9; }
  .ip-header h1 { font-size: 15px; font-weight: 700; color: #0D1B3E; }
  .ip-header p { font-size: 11px; color: #94A3B8; margin-top: 2px; }
  .ip-body { flex: 1; overflow-y: auto; padding: 18px 22px; }
  .ip-footer { padding: 14px 22px; border-top: 1px solid #F1F5F9; display: flex; gap: 9px; }

  .sec { font-size: 10px; font-weight: 700; color: #94A3B8; letter-spacing: 0.08em; text-transform: uppercase; margin: 18px 0 8px; }
  .sec:first-child { margin-top: 0; }

  .period-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 7px; }
  .period-row select, .period-row input { width: 100%; font-size: 12px; padding: 7px 9px; border: 1px solid #E2E8F0; border-radius: 7px; color: #0D1B3E; background: #F8FAFC; outline: none; }
  .period-row select:focus, .period-row input:focus { border-color: #1B5EF7; background: #fff; }

  .cover-inputs { display: flex; flex-direction: column; gap: 6px; }
  .cover-inputs input { width: 100%; font-size: 12px; padding: 7px 9px; border: 1px solid #E2E8F0; border-radius: 7px; color: #0D1B3E; background: #F8FAFC; outline: none; }
  .cover-inputs input:focus { border-color: #1B5EF7; background: #fff; }
  .hint { font-size: 10px; color: #B0BAC8; margin-top: 2px; margin-bottom: 4px; }

  .car-block { background: #F8FAFC; border: 1px solid #E8EEF6; border-radius: 9px; padding: 12px; margin-bottom: 8px; }
  .cb-head { display: flex; align-items: center; gap: 7px; margin-bottom: 10px; }
  .cb-num { width: 22px; height: 22px; border-radius: 50%; background: #1B5EF7; color: #fff; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .cb-head span { font-size: 12px; font-weight: 600; color: #0D1B3E; }
  .f2 { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; margin-bottom: 7px; }
  .f1 { margin-bottom: 7px; }
  .fg label { font-size: 10px; color: #64748B; font-weight: 600; display: block; margin-bottom: 3px; }
  .fg input { width: 100%; font-size: 12px; padding: 6px 9px; border: 1px solid #E2E8F0; border-radius: 6px; color: #0D1B3E; background: #fff; outline: none; }
  .fg input:focus { border-color: #1B5EF7; }
  .img-upload-area { display: flex; gap: 7px; align-items: center; }
  .img-status { flex: 1; font-size: 12px; padding: 7px 10px; border: 1px dashed #CBD5E1; border-radius: 6px; color: #94A3B8; background: #F8FAFC; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .img-status.done { border-style: solid; border-color: #22C55E; color: #16A34A; background: #F0FDF4; font-weight: 600; }
  .up-btn { padding: 6px 12px; font-size: 11px; font-weight: 600; border: 1px solid #CBD5E1; border-radius: 6px; background: #fff; color: #475569; cursor: pointer; white-space: nowrap; flex-shrink: 0; }
  .up-btn:hover { border-color: #1B5EF7; color: #1B5EF7; }

  .btn-gen { flex: 1; padding: 10px; font-size: 13px; font-weight: 700; border: none; border-radius: 8px; background: #1B5EF7; color: #fff; cursor: pointer; }
  .btn-gen:hover { background: #1450D4; }
  .btn-dl { flex: 1; padding: 10px; font-size: 13px; font-weight: 700; border: 1.5px solid #1B5EF7; border-radius: 8px; background: #fff; color: #1B5EF7; cursor: pointer; }
  .btn-dl:hover { background: #EEF3FF; }

  /* 미리보기 패널 */
  .preview-panel { padding: 22px; overflow-y: auto; }
  .pv-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
  .pv-head h2 { font-size: 14px; font-weight: 700; color: #0D1B3E; }
  .pv-head span { font-size: 11px; color: #94A3B8; }
  .pv-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
  .pv-item { background: #fff; border-radius: 10px; overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,0.07); }
  .pv-label { padding: 7px 12px; font-size: 11px; font-weight: 600; color: #64748B; border-bottom: 1px solid #F1F5F9; display: flex; justify-content: space-between; align-items: center; }
  .pv-label button { font-size: 11px; font-weight: 600; color: #1B5EF7; background: none; border: none; cursor: pointer; padding: 2px 6px; border-radius: 4px; }
  .pv-label button:hover { background: #EEF3FF; }
  .pv-label .edit-btn { color: #F59E0B; }
  .pv-label .edit-btn:hover { background: #FEF3C7; }
  canvas.pv-canvas { width: 100%; display: block; }
  .empty { grid-column: 1/-1; text-align: center; padding: 50px 20px; color: #94A3B8; font-size: 13px; }

  /* 드래그 편집 모달 */
  .edit-modal-bg { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.55); z-index: 100; align-items: center; justify-content: center; }
  .edit-modal-bg.open { display: flex; }
  .edit-modal { background: #fff; border-radius: 16px; padding: 20px; width: 90vw; max-width: 560px; }
  .edit-modal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .edit-modal-header h3 { font-size: 14px; font-weight: 700; color: #0D1B3E; }
  .edit-modal-header .close-btn { font-size: 18px; background: none; border: none; cursor: pointer; color: #94A3B8; line-height: 1; }
  .edit-tip { font-size: 11px; color: #94A3B8; margin-bottom: 10px; }
  .edit-tip span { color: #1B5EF7; font-weight: 600; }

  /* 편집용 캔버스 래퍼 */
  .edit-canvas-wrap { position: relative; width: 100%; background: #F1F5F9; border-radius: 10px; overflow: hidden; }
  #edit-canvas { display: block; width: 100%; cursor: default; }

  /* 편집 하단 컨트롤 */
  .edit-controls { margin-top: 12px; }
  .edit-car-tabs { display: flex; gap: 6px; margin-bottom: 10px; }
  .edit-car-tab { padding: 5px 12px; font-size: 12px; font-weight: 600; border: 1px solid #E2E8F0; border-radius: 20px; cursor: pointer; background: #fff; color: #64748B; }
  .edit-car-tab.active { background: #1B5EF7; color: #fff; border-color: #1B5EF7; }
  .edit-sliders { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .slider-group label { font-size: 11px; color: #64748B; font-weight: 600; display: block; margin-bottom: 4px; }
  .slider-row { display: flex; align-items: center; gap: 6px; }
  .slider-row input[type=range] { flex: 1; }
  .slider-row input[type=number] { width: 54px; font-size: 12px; padding: 4px 6px; border: 1px solid #E2E8F0; border-radius: 6px; color: #0D1B3E; text-align: center; outline: none; }
  .slider-row input[type=number]:focus { border-color: #1B5EF7; }
  .slider-row input[type=number]::-webkit-inner-spin-button { opacity: 1; }
  .edit-footer-btns { display: flex; gap: 8px; margin-top: 14px; }
  .edit-footer-btns button { flex: 1; padding: 9px; font-size: 13px; font-weight: 700; border-radius: 8px; cursor: pointer; }
  .btn-reset { border: 1px solid #E2E8F0; background: #fff; color: #64748B; }
  .btn-apply { border: none; background: #1B5EF7; color: #fff; }

  #rc { display: none; }

  /* 테마 선택 */
  .theme-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 7px; }
  .theme-item { border-radius: 8px; overflow: hidden; cursor: pointer; border: 2px solid transparent; transition: border-color 0.15s; }
  .theme-item:hover { border-color: #94A3B8; }
  .theme-item.active { border-color: #1B5EF7; }
  .theme-thumb { width: 100%; aspect-ratio: 4/5; display: block; }
  .theme-name { font-size: 10px; font-weight: 600; color: #64748B; text-align: center; padding: 4px 0; }
  .theme-item.active .theme-name { color: #1B5EF7; }
</style>
</head>
<body>
<div class="app">
  <div class="input-panel">
    <div class="ip-header">
      <h1>다나와자동차 카드 생성기</h1>
      <p>카카오채널 주간 소식 이미지</p>
    </div>
    <div class="ip-body">
      <div class="sec">카드 테마</div>
      <div class="theme-grid" id="theme-grid"></div>

      <div class="sec">배경 레이아웃</div>
      <div class="theme-grid" id="layout-grid"></div>

      <div class="sec">발행 기간</div>
      <div class="period-row">
        <input type="text" id="y" value="2026" placeholder="연도">
        <select id="mo">
          <option>1월</option><option>2월</option><option>3월</option>
          <option selected>4월</option><option>5월</option><option>6월</option>
          <option>7월</option><option>8월</option><option>9월</option>
          <option>10월</option><option>11월</option><option>12월</option>
        </select>
        <select id="wk">
          <option>1주차</option><option>2주차</option>
          <option>3주차</option><option>4주차</option><option>5주차</option>
        </select>
      </div>
      <div class="sec">커버 카드 문구</div>
      <div class="cover-inputs">
        <div>
          <input type="text" id="cb" value="다나와자동차" placeholder="상단 배지 텍스트">
          <div class="hint">상단 파란 배지 안 문구</div>
        </div>
        <div>
          <input type="text" id="c1" value="가장 많이 찾는" placeholder="첫째 줄 (검정)">
          <div class="hint">검정 텍스트</div>
        </div>
        <div>
          <input type="text" id="c2" value="차량만 모았어요!" placeholder="둘째 줄 (파랑 강조)">
          <div class="hint">파란 강조 텍스트</div>
        </div>
        <div>
          <input type="text" id="cs" value="렌트·리스 인기 차종, 월 17만원대부터" placeholder="서브텍스트">
        </div>
      </div>
      <div class="sec">차량 정보 (6대)</div>
      <div id="car-list"></div>
    </div>
    <div class="ip-footer">
      <button class="btn-gen" onclick="renderAll()">미리보기 생성</button>
      <button class="btn-dl" onclick="downloadAll()">전체 저장</button>
    </div>
  </div>

  <div class="preview-panel">
    <div class="pv-head">
      <h2>미리보기</h2>
      <span id="pv-period">—</span>
    </div>
    <div class="pv-grid" id="pv-grid">
      <div class="empty">입력 후 <strong>미리보기 생성</strong>을 눌러주세요<br>커버 1장 + 차량 카드 6장</div>
    </div>
  </div>
</div>

<!-- 드래그 편집 모달 -->
<div class="edit-modal-bg" id="edit-modal-bg">
  <div class="edit-modal">
    <div class="edit-modal-header">
      <h3>커버 카드 차량 위치 편집</h3>
      <button class="close-btn" onclick="closeEditModal()">✕</button>
    </div>
    <div class="edit-tip">차량을 <span>드래그</span>해서 위치를 조정하거나, 아래 슬라이더로 세밀하게 조정하세요</div>
    <div class="edit-canvas-wrap">
      <canvas id="edit-canvas"></canvas>
    </div>
    <div class="edit-controls">
      <div class="edit-car-tabs" id="edit-tabs"></div>
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:10px;padding:8px 10px;background:#F8FAFC;border-radius:8px;border:1px solid #E2E8F0;">
        <span id="vis-toggle-label" style="font-size:12px;font-weight:600;color:#0D1B3E;flex:1;">차량 1 이미지</span>
        <button id="vis-toggle-btn" onclick="toggleVisActive()"
          style="padding:5px 18px;font-size:12px;font-weight:700;border-radius:20px;border:1px solid;cursor:pointer;">ON</button>
      </div>
      <div class="edit-sliders">
        <div class="slider-group">
          <label>X 위치</label>
          <div class="slider-row">
            <input type="range" id="sl-x" min="-150" max="600" step="1" oninput="onSlider('x',this.value)">
            <input type="number" id="num-x" min="-150" max="600" step="1" oninput="onNumber('x',this.value)">
          </div>
        </div>
        <div class="slider-group">
          <label>Y 위치</label>
          <div class="slider-row">
            <input type="range" id="sl-y" min="200" max="800" step="1" oninput="onSlider('y',this.value)">
            <input type="number" id="num-y" min="200" max="800" step="1" oninput="onNumber('y',this.value)">
          </div>
        </div>
        <div class="slider-group">
          <label>크기 (%)</label>
          <div class="slider-row">
            <input type="range" id="sl-s" min="20" max="200" step="1" oninput="onSlider('s',this.value)">
            <input type="number" id="num-s" min="20" max="200" step="1" oninput="onNumber('s',this.value)">
          </div>
        </div>
        <div class="slider-group">
          <label>순서 (앞/뒤)</label>
          <div class="slider-row">
            <input type="range" id="sl-z" min="1" max="3" step="1" oninput="onSlider('z',this.value)">
            <input type="number" id="num-z" min="1" max="3" step="1" oninput="onNumber('z',this.value)">
          </div>
        </div>
      </div>
    </div>
    <div class="edit-footer-btns">
      <button class="btn-reset" onclick="resetPositions()">기본값으로</button>
      <button class="btn-apply" onclick="applyEdit()">적용하기</button>
    </div>
  </div>
</div>

<canvas id="rc"></canvas>

<script>
const W = 600, H = 800;
const BLUE = '#1B5EF7';
const DARK = '#0D1B3E';
const CREAM = '#EEE9E0';
const FOOTER_H = 56;

const cars = Array.from({length:6}, () => ({ name:'', spec:'', monthly:'', img:null, priceType:'rent' }));

/* ══════════════════════════════════
   테마 정의
══════════════════════════════════ */
const THEMES = [
  {
    id: 'classic',
    name: '클래식',
    bg: '#EEE9E0',
    accent: '#1B5EF7',
    priceColor: '#1B5EF7',
    textDark: '#0D1B3E',
    coverTriColor: '#1B5EF7',
    cardDeco1: 'rgba(0,0,0,0.04)',
    cardDeco2: 'rgba(0,0,0,0.04)',
  },
  {
    id: 'dark',
    name: '다크',
    bg: '#0D1B3E',
    accent: '#C9A84C',
    priceColor: '#C9A84C',
    textDark: '#FFFFFF',
    coverTriColor: '#C9A84C',
    cardDeco1: 'rgba(201,168,76,0.08)',
    cardDeco2: 'rgba(201,168,76,0.05)',
  },
  {
    id: 'white',
    name: '화이트',
    bg: '#FFFFFF',
    accent: '#1B5EF7',
    priceColor: '#1B5EF7',
    textDark: '#0D1B3E',
    coverTriColor: '#1B5EF7',
    cardDeco1: 'rgba(27,94,247,0.05)',
    cardDeco2: 'rgba(27,94,247,0.03)',
  },
  {
    id: 'green',
    name: '그린',
    bg: '#E8F5EE',
    accent: '#1A6B3C',
    priceColor: '#1A6B3C',
    textDark: '#0D2B1A',
    coverTriColor: '#1A6B3C',
    cardDeco1: 'rgba(26,107,60,0.06)',
    cardDeco2: 'rgba(26,107,60,0.04)',
  },
  {
    id: 'sunset',
    name: '선셋',
    bg: '#FDF0E8',
    accent: '#C94A1A',
    priceColor: '#C94A1A',
    textDark: '#2D1206',
    coverTriColor: '#C94A1A',
    cardDeco1: 'rgba(201,74,26,0.06)',
    cardDeco2: 'rgba(201,74,26,0.04)',
  },
];
let activeTheme = THEMES[0];

function buildThemeGrid() {
  const grid = document.getElementById('theme-grid');
  grid.innerHTML = '';
  THEMES.forEach((t, i) => {
    const item = document.createElement('div');
    item.className = 'theme-item' + (i === 0 ? ' active' : '');
    item.onclick = () => selectTheme(i);
    item.id = 'theme-' + t.id;

    // 썸네일 캔버스
    const tc = document.createElement('canvas');
    tc.className = 'theme-thumb';
    tc.width = 80; tc.height = 100;
    drawThumbCanvas(tc, t);

    const name = document.createElement('div');
    name.className = 'theme-name';
    name.textContent = t.name;

    item.appendChild(tc);
    item.appendChild(name);
    grid.appendChild(item);
  });
}

function drawThumbCanvas(tc, t) {
  const ctx = tc.getContext('2d');
  const tw = 80, th = 100;
  // 배경
  ctx.fillStyle = t.bg; ctx.fillRect(0,0,tw,th);
  // 삼각형
  ctx.fillStyle = t.coverTriColor;
  ctx.beginPath(); ctx.moveTo(0,th*0.55); ctx.lineTo(0,th); ctx.lineTo(tw*0.72,th); ctx.closePath(); ctx.fill();
  // 배지
  ctx.fillStyle = t.accent;
  ctx.beginPath(); ctx.roundRect(tw*0.2, 6, tw*0.6, 10, 5); ctx.fill();
  // 텍스트 줄
  ctx.fillStyle = t.textDark; ctx.fillRect(tw*0.12, 22, tw*0.55, 5);
  ctx.fillStyle = t.accent; ctx.fillRect(tw*0.12, 31, tw*0.72, 7);
  ctx.fillStyle = t.textDark + '66'; ctx.fillRect(tw*0.12, 43, tw*0.45, 4);
}

function selectTheme(i) {
  activeTheme = THEMES[i];
  document.querySelectorAll('.theme-item').forEach((el, j) => el.classList.toggle('active', j === i));
  // 레이아웃 썸네일도 현재 테마 색으로 갱신
  document.querySelectorAll('#layout-grid .theme-thumb').forEach((tc, j) => drawLayoutThumb(tc, LAYOUTS[j]));
}

/* ══════════════════════════════════
   레이아웃 정의
══════════════════════════════════ */
const LAYOUTS = [
  { id: 'triangle', name: '삼각형' },
  { id: 'roundbar', name: '라운드바' },
  { id: 'polygon',  name: '폴리곤'  },
  { id: 'blob',     name: '블롭'    },
];
let activeLayout = LAYOUTS[0];

function buildLayoutGrid() {
  const grid = document.getElementById('layout-grid');
  grid.innerHTML = '';
  LAYOUTS.forEach((l, i) => {
    const item = document.createElement('div');
    item.className = 'theme-item' + (i === 0 ? ' active' : '');
    item.onclick = () => selectLayout(i);

    const tc = document.createElement('canvas');
    tc.className = 'theme-thumb';
    tc.width = 80; tc.height = 100;
    drawLayoutThumb(tc, l);

    const name = document.createElement('div');
    name.className = 'theme-name';
    name.textContent = l.name;

    item.appendChild(tc);
    item.appendChild(name);
    grid.appendChild(item);
  });
}

/* ── 헬퍼: 랜덤 시드 기반 pseudo-random ── */
function seededRand(seed) {
  let s = seed;
  return () => { s = (s * 1664525 + 1013904223) & 0xffffffff; return (s >>> 0) / 0xffffffff; };
}

/* ── 로우폴리 삼각형 (폴리곤) ── */
function drawLowPoly(ctx, w, h, T) {
  const getColor = (y) => {
    const t = Math.min(1, Math.max(0, y/h));
    const hex = T.accent.replace('#','');
    const ar=parseInt(hex.slice(0,2),16),ag=parseInt(hex.slice(2,4),16),ab=parseInt(hex.slice(4,6),16);
    const r=Math.round(255+(ar-255)*t), g=Math.round(255+(ag-255)*t), b=Math.round(255+(ab-255)*t);
    return 'rgb('+r+','+g+','+b+')';
  };
  const rand=seededRand(42);
  const cols=6,rows=8,cellW=w/cols,cellH=h/rows;
  const pts=[];
  for(let r=0;r<=rows;r++){for(let c=0;c<=cols;c++){
    pts.push({
      x:c*cellW+(c>0&&c<cols?(rand()-0.5)*cellW*0.7:0),
      y:r*cellH+(r>0&&r<rows?(rand()-0.5)*cellH*0.7:0)
    });
  }}
  for(let r=0;r<rows;r++){for(let c=0;c<cols;c++){
    const i=r*(cols+1)+c;
    const a=pts[i],b=pts[i+1],d=pts[i+cols+1],e=pts[i+cols+2];
    ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.lineTo(d.x,d.y);ctx.closePath();
    ctx.fillStyle=getColor((a.y+b.y+d.y)/3);ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,0.15)';ctx.lineWidth=0.6;ctx.stroke();
    ctx.beginPath();ctx.moveTo(b.x,b.y);ctx.lineTo(d.x,d.y);ctx.lineTo(e.x,e.y);ctx.closePath();
    ctx.fillStyle=getColor((b.y+d.y+e.y)/3);ctx.fill();ctx.stroke();
  }}
}

/* ── 소프트 방사형 그라데이션 (라운드바) ── */
function drawSoftGradient(ctx, w, h, T) {
  ctx.fillStyle='#ffffff';ctx.fillRect(0,0,w,h);
  const blobs=[
    {x:w*0.28,y:h*0.42,r:w*0.72,c:T.accent},
    {x:w*0.82,y:h*0.20,r:w*0.55,c:T.coverTriColor},
    {x:w*0.10,y:h*0.85,r:w*0.45,c:T.accent},
  ];
  blobs.forEach(b=>{
    const hex=b.c.replace('#','');
    const ar=parseInt(hex.slice(0,2),16),ag=parseInt(hex.slice(2,4),16),ab=parseInt(hex.slice(4,6),16);
    const g=ctx.createRadialGradient(b.x,b.y,0,b.x,b.y,b.r);
    g.addColorStop(0,'rgba('+ar+','+ag+','+ab+',0.42)');
    g.addColorStop(0.5,'rgba('+ar+','+ag+','+ab+',0.16)');
    g.addColorStop(1,'rgba('+ar+','+ag+','+ab+',0)');
    ctx.fillStyle=g;ctx.fillRect(0,0,w,h);
  });
}

/* ── 빛줄기 + 파티클 (블롭) ── */
function drawLightRay(ctx, w, h, T) {
  // 테마 accent 색을 HSL로 변환해 채도 낮추고 명도 조절해서 배경색 생성
  const hex = T.accent.replace('#','');
  const ar = parseInt(hex.slice(0,2),16);
  const ag = parseInt(hex.slice(2,4),16);
  const ab = parseInt(hex.slice(4,6),16);
  // 배경: accent를 어둡고 부드럽게 — 원색에 흰색 섞기
  const mix = (c, w2) => Math.round(c * (1-w2) + 255 * w2);
  const br = mix(ar, 0.30), bg2 = mix(ag, 0.35), bb = mix(ab, 0.30);
  const dr = mix(ar, 0.15), dg = mix(ag, 0.18), db = mix(ab, 0.15);

  const bg = ctx.createLinearGradient(w, 0, 0, h);
  bg.addColorStop(0,   `rgb(${br},${bg2},${bb})`);
  bg.addColorStop(0.5, `rgb(${mix(br,0.1)},${mix(bg2,0.1)},${mix(bb,0.1)})`);
  bg.addColorStop(1,   `rgb(${dr},${dg},${db})`);
  ctx.fillStyle = bg; ctx.fillRect(0,0,w,h);

  // 빛줄기 — 대각선
  const rays = [
    {cx: w*0.18, angle: -0.52, width: w*0.22, alpha: 0.38},
    {cx: w*0.42, angle: -0.48, width: w*0.30, alpha: 0.55},
    {cx: w*0.70, angle: -0.50, width: w*0.20, alpha: 0.42},
  ];
  rays.forEach(ray => {
    ctx.save();
    ctx.translate(ray.cx, h * 0.5);
    ctx.rotate(ray.angle);
    const g = ctx.createLinearGradient(-ray.width, 0, ray.width, 0);
    g.addColorStop(0,   'rgba(255,255,255,0)');
    g.addColorStop(0.3, `rgba(255,255,255,${ray.alpha * 0.5})`);
    g.addColorStop(0.5, `rgba(255,255,255,${ray.alpha})`);
    g.addColorStop(0.7, `rgba(255,255,255,${ray.alpha * 0.5})`);
    g.addColorStop(1,   'rgba(255,255,255,0)');
    ctx.fillStyle = g;
    ctx.fillRect(-ray.width, -h * 0.8, ray.width * 2, h * 1.6);
    ctx.restore();
  });

  // 파티클
  const rand = seededRand(77);
  const pCount = w > 200 ? 55 : 10;
  for (let i = 0; i < pCount; i++) {
    const px = rand()*w, py = rand()*h, pr = rand()*2.2+0.5;
    ctx.beginPath(); ctx.arc(px, py, pr, 0, Math.PI*2);
    ctx.fillStyle = `rgba(255,255,255,${rand()*0.5+0.15})`; ctx.fill();
  }
}

function drawLayoutThumb(tc, l) {
  const ctx = tc.getContext('2d');
  const tw = 80, th = 100;
  const T = activeTheme;
  ctx.fillStyle = T.bg; ctx.fillRect(0,0,tw,th);

  if (l.id === 'triangle') {
    ctx.fillStyle = T.coverTriColor + 'CC';
    ctx.beginPath(); ctx.moveTo(0,th*0.55); ctx.lineTo(0,th); ctx.lineTo(tw*0.72,th); ctx.closePath(); ctx.fill();

  } else if (l.id === 'roundbar') {
    drawSoftGradient(ctx, tw, th, T);

  } else if (l.id === 'polygon') {
    drawLowPoly(ctx, tw, th, T);

  } else if (l.id === 'blob') {
    drawLightRay(ctx, tw, th, T);

  }

  // 공통: 배지 + 텍스트 줄
  ctx.fillStyle=T.accent;
  ctx.beginPath();ctx.roundRect(tw*0.2,6,tw*0.6,10,5);ctx.fill();
  ctx.fillStyle=T.textDark;ctx.fillRect(tw*0.12,22,tw*0.55,5);
  ctx.fillStyle=T.accent;ctx.fillRect(tw*0.12,31,tw*0.72,7);
}

function selectLayout(i) {

/* ── 커버 배경 드로우 (레이아웃별 분기) ── */
function drawCoverBg(ctx) {
  const T = activeTheme;
  if (activeLayout.id === 'triangle') {
    ctx.fillStyle = T.bg; ctx.fillRect(0,0,W,H);
    ctx.fillStyle = T.coverTriColor;
    ctx.beginPath();
    ctx.moveTo(0,H*0.60); ctx.lineTo(0,H); ctx.lineTo(W*0.72,H);
    ctx.closePath(); ctx.fill();

  } else if (activeLayout.id === 'roundbar') {
    drawSoftGradient(ctx, W, H, T);

  } else if (activeLayout.id === 'polygon') {
    ctx.fillStyle = '#ffffff'; ctx.fillRect(0,0,W,H);
    drawLowPoly(ctx, W, H, T);

  } else if (activeLayout.id === 'blob') {
    drawLightRay(ctx, W, H, T);

  }
}

/* ── 차량카드 배경 드로우 (레이아웃별 분기) ── */
function drawCardBg(ctx) {
  const T = activeTheme;
  if (activeLayout.id === 'triangle') {
    ctx.fillStyle = T.bg; ctx.fillRect(0,0,W,H);
    ctx.beginPath();ctx.arc(W+80,H+80,360,0,Math.PI*2);
    ctx.fillStyle=T.cardDeco1;ctx.fill();
    ctx.beginPath();ctx.arc(-80,-80,360,0,Math.PI*2);
    ctx.fillStyle=T.cardDeco2;ctx.fill();

  } else if (activeLayout.id === 'roundbar') {
    drawSoftGradient(ctx, W, H, T);

  } else if (activeLayout.id === 'polygon') {
    ctx.fillStyle = '#ffffff'; ctx.fillRect(0,0,W,H);
    drawLowPoly(ctx, W, H, T);

  } else if (activeLayout.id === 'blob') {
    drawLightRay(ctx, W, H, T);
  }
}

// 커버 차량 위치 상태 (x, y = 차량 중심 기준, scale = 배율)
/* ── 커버 카드 드로우 ── */
async function drawCoverToCtx(ctx, slots) {
  const line1 = document.getElementById('c1').value || '가장 많이 찾는';
  const line2 = document.getElementById('c2').value || '차량만 모았어요!';
  const sub   = document.getElementById('cs').value || '';
  const T = activeTheme;
  const L = activeLayout.id;

  drawCoverBg(ctx);

  const badgeText = document.getElementById('cb').value || '다나와자동차';

  // 배경 밝기 판단
  // - blob: 항상 어두운 배경 → 흰 텍스트
  // - roundbar/polygon: 배경이 항상 밝음(흰색 베이스) → 어두운 텍스트 강제
  // - triangle: 테마 bg 위 → 테마 색상 그대로
  const isBlob = (L === 'blob');
  const isBrightBg = (L === 'roundbar' || L === 'polygon'); // 배경이 항상 밝음
  const isDark = (T.id === 'dark');

  // 밝은 배경(roundbar/polygon)에서는 다크 테마여도 어두운 텍스트 강제
  const TEXT_DARK_FORCED = '#1a1a2e';
  const ACCENT_ON_BRIGHT = isBrightBg ? T.accent : T.accent; // accent는 그대로
  const textMain  = isBlob ? '#ffffff' : (isBrightBg ? TEXT_DARK_FORCED : T.textDark);
  const textAccent= isBlob ? 'rgba(255,255,255,0.92)' : ACCENT_ON_BRIGHT;
  const textSub   = isBlob ? 'rgba(255,255,255,0.72)'
                           : (isBrightBg ? 'rgba(30,30,50,0.55)' : (isDark ? 'rgba(255,255,255,0.55)' : 'rgba(40,40,60,0.55)'));

  ctx.font = 'bold 20px sans-serif';
  const bw = ctx.measureText(badgeText).width + 48;
  const bx = (W-bw)/2;

  if (isBlob) {
    // 블롭: 반투명 흰 테두리 배지
    ctx.fillStyle = 'rgba(255,255,255,0.22)'; rr(ctx,bx,34,bw,36,18); ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,0.65)'; ctx.lineWidth=1.5;
    rr(ctx,bx,34,bw,36,18); ctx.stroke();
    ctx.shadowColor='rgba(0,0,0,0.25)'; ctx.shadowBlur=8;
    ctx.fillStyle='#fff'; ctx.textAlign='center'; ctx.fillText(badgeText, W/2, 58);
    ctx.font='bold 56px sans-serif';
    ctx.shadowColor='rgba(0,0,0,0.30)'; ctx.shadowBlur=16;
  } else {
    // triangle/roundbar/polygon: accent 배지
    ctx.fillStyle = T.accent; rr(ctx,bx,34,bw,36,18); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.textAlign='center'; ctx.fillText(badgeText, W/2, 58);
    ctx.font='bold 56px sans-serif'; ctx.textAlign='center';
  }

  ctx.fillStyle = textMain; ctx.fillText(line1, W/2, 150);
  ctx.fillStyle = textAccent; ctx.fillText(line2, W/2, 216);
  ctx.fillStyle = textSub;
  ctx.font = '21px sans-serif'; ctx.fillText(sub, W/2, 256);
  ctx.shadowColor='transparent'; ctx.shadowBlur=0;

  ctx.textAlign = 'left';
  ctx.shadowColor = 'transparent'; ctx.shadowBlur = 0;

  // 차량 이미지 그리기 (visible 필터)
  const ordered = [...slots].filter(s => s.visible !== false).sort((a,b) => a.z - b.z);
  for (const s of ordered) {
    const cidx = s.cidx !== undefined ? s.cidx : ordered.indexOf(s);
    const carImg = cars[cidx].img;
    const BASE_W = 400;
    const drawW = BASE_W * s.scale / 100;
    if (carImg) {
      const aspect = carImg.height / carImg.width;
      const drawH = drawW * aspect;
      ctx.drawImage(carImg, s.x - drawW/2, s.y - drawH/2, drawW, drawH);
    } else {
      ctx.fillStyle = 'rgba(0,0,0,0.07)';
      const ph = drawW * 0.56;
      rr(ctx, s.x-drawW/2, s.y-ph/2, drawW, ph, 10); ctx.fill();
      ctx.fillStyle='rgba(0,0,0,0.2)'; ctx.font='16px sans-serif'; ctx.textAlign='center';
      ctx.fillText('차량 '+(cidx+1), s.x, s.y+5); ctx.textAlign='left';
    }
  }
}

/* ── 차량 카드 ── */
async function drawCarCard(ctx, car) {
  const T = activeTheme;
  const L = activeLayout.id;
  drawCardBg(ctx);

  const px = 40;
  const isBlob     = (L === 'blob');
  const isPolygon  = (L === 'polygon');
  const isRoundbar = (L === 'roundbar');
  const isDark     = (T.id === 'dark');

  // ── 상단: 차량명 + 스펙 ──
  // 폴리곤: 상단 흰색 → 어두운 텍스트
  // 라운드바: 흰 베이스 → 어두운 텍스트
  // 블롭: 어두운 배경 → 흰 텍스트 + 그림자
  // 삼각형: 테마 textDark
  let nameColor, specColor;
  if (isBlob) {
    nameColor = '#ffffff';
    specColor = 'rgba(255,255,255,0.80)';
    ctx.shadowColor='rgba(0,0,0,0.35)'; ctx.shadowBlur=12;
  } else if (isPolygon || isRoundbar) {
    nameColor = '#1a1a2e';
    specColor = 'rgba(30,30,50,0.55)';
  } else {
    nameColor = T.textDark;
    specColor = isDark ? 'rgba(255,255,255,0.5)' : '#888888';
  }

  ctx.fillStyle=nameColor; ctx.font='bold 48px sans-serif';
  ctx.fillText(car.name||'차량명을 입력하세요', px, 115);
  if (isBlob) ctx.shadowBlur=6;
  ctx.fillStyle=specColor; ctx.font='20px sans-serif';
  ctx.fillText(car.spec||'트림 정보', px, 150);
  if (isBlob) { ctx.shadowColor='transparent'; ctx.shadowBlur=0; }

  // ── 차량 이미지 ──
  const imgObj=car.img;
  const imgX=15, imgY=170, imgW=W-30, imgH=390;
  if(imgObj){
    const scale=Math.min(imgW/imgObj.width,imgH/imgObj.height);
    const dw=imgObj.width*scale,dh=imgObj.height*scale;
    ctx.drawImage(imgObj,imgX+(imgW-dw)/2,imgY+(imgH-dh)/2,dw,dh);
  } else {
    ctx.fillStyle='rgba(0,0,0,0.05)'; rr(ctx,imgX,imgY,imgW,imgH,14); ctx.fill();
    ctx.fillStyle='rgba(0,0,0,0.18)'; ctx.font='18px sans-serif'; ctx.textAlign='center';
    ctx.fillText('차량 이미지를 추가해주세요',W/2,imgY+imgH/2+8); ctx.textAlign='left';
  }

  // ── 하단 가격 ──
  // 폴리곤: 하단이 진한 accent → 흰 텍스트로 대비
  // 라운드바: 흰 베이스 → accent 텍스트 (배경 밝음)
  // 블롭: 어두운 배경 → 흰 텍스트
  // 삼각형: 테마 priceColor
  let finalPriceColor, finalLabelColor;
  if (isBlob) {
    finalPriceColor = '#ffffff';
    finalLabelColor = 'rgba(255,255,255,0.80)';
    ctx.shadowColor='rgba(0,0,0,0.35)'; ctx.shadowBlur=8;
  } else if (isPolygon) {
    // 하단이 accent 색으로 진해짐 → 흰 텍스트
    finalPriceColor = '#ffffff';
    finalLabelColor = 'rgba(255,255,255,0.80)';
  } else if (isRoundbar) {
    // 흰 베이스 배경 → accent 텍스트
    finalPriceColor = T.accent;
    finalLabelColor = isDark ? 'rgba(255,255,255,0.5)' : '#888888';
  } else {
    // 삼각형
    finalPriceColor = T.priceColor;
    finalLabelColor = isDark ? 'rgba(255,255,255,0.5)' : '#888888';
  }

  const priceLabel = car.priceType === 'price' ? '차량 가격' : '장기 렌트/리스';
  ctx.fillStyle=finalLabelColor; ctx.font='19px sans-serif'; ctx.textAlign='center';
  ctx.fillText(priceLabel, W/2, 598);
  ctx.fillStyle=finalPriceColor; ctx.font='bold 62px sans-serif';
  ctx.fillText(car.monthly||'금액을 입력하세요', W/2, 672);
  if (isBlob) { ctx.shadowColor='transparent'; ctx.shadowBlur=0; }
  ctx.textAlign='left';
}

/* ── 렌더 ── */
async function renderAll() {
  const period = getPeriod();
  document.getElementById('pv-period').textContent = period;
  const cvs = document.getElementById('rc');
  cvs.width=W; cvs.height=H;
  const ctx = cvs.getContext('2d');
  const results = [];
  const slotsWithIdx = coverSlots.map((s,i) => ({...s, cidx:i}));
  await drawCoverToCtx(ctx, slotsWithIdx);
  results.push({ canvas: clone(cvs), label:'커버 카드', isCover: true });
  for (let i=0; i<6; i++) {
    await drawCarCard(ctx, cars[i]);
    results.push({ canvas: clone(cvs), label:`차량 ${i+1}`, isCover: false });
  }
  const grid = document.getElementById('pv-grid');
  grid.innerHTML = '';
  results.forEach(({canvas,label,isCover}, idx) => {
    const item = document.createElement('div'); item.className='pv-item';
    const lbar = document.createElement('div'); lbar.className='pv-label';
    const btnHtml = isCover
      ? `<div style="display:flex;gap:4px"><button onclick="dlOne(${idx})">저장</button><button class="edit-btn" onclick="openEditModal()">✏️ 위치 편집</button></div>`
      : `<button onclick="dlOne(${idx})">저장</button>`;
    lbar.innerHTML = `<span>${label}</span>${btnHtml}`;
    const cv = document.createElement('canvas'); cv.className='pv-canvas';
    cv.width=300; cv.height=400;
    cv.getContext('2d').drawImage(canvas,0,0,300,400);
    cv.style.cursor = 'default';
    item.appendChild(lbar); item.appendChild(cv);
    grid.appendChild(item);
  });
  window._res=results; window._period=period;
}

    btn.onclick = () => selectTab(i);
    tabs.appendChild(btn);
  });
  // ON/OFF 토글 행
  let visRow = document.getElementById('vis-toggle-row');
  if (!visRow) {
    visRow = document.createElement('div');
    visRow.id = 'vis-toggle-row';
    visRow.style.cssText = 'display:none;';
    tabs.parentNode.insertBefore(visRow, tabs.nextSibling);
  }
}

function _setVisStyle(btn, visible) {
  btn.textContent = visible ? 'ON' : 'OFF';
  btn.style.background = visible ? '#1B5EF7' : '#E2E8F0';
  btn.style.color = visible ? '#fff' : '#94A3B8';
  btn.style.borderColor = visible ? '#1B5EF7' : '#CBD5E1';
}

function toggleVisActive() {
  const s = editSlots[activeTab];
  s.visible = !(s.visible !== false);
  _setVisStyle(document.getElementById('vis-toggle-btn'), s.visible);
  renderEditCanvas();
}

const DEFAULT_SLOTS = [
  { x: 140, y: 500, scale: 100, z: 1, visible: true },
  { x: 440, y: 540, scale: 110, z: 2, visible: true },
  { x: 290, y: 700, scale: 140, z: 3, visible: true },
];
let coverSlots = DEFAULT_SLOTS.map(s => ({...s}));

function selectTab(i) {
  activeTab = i;
  document.querySelectorAll('.edit-car-tab').forEach((b,j) => b.classList.toggle('active', j===i));
  const s = editSlots[i];
  document.getElementById('sl-x').value = s.x;
  document.getElementById('sl-y').value = s.y;
  document.getElementById('sl-s').value = s.scale;
  document.getElementById('sl-z').value = s.z;
  document.getElementById('num-x').value = Math.round(s.x);
  document.getElementById('num-y').value = Math.round(s.y);
  document.getElementById('num-s').value = Math.round(s.scale);
  document.getElementById('num-z').value = s.z;
  // ON/OFF 버튼 업데이트
  const visBtn = document.getElementById('vis-toggle-btn');
  if (visBtn) {
    document.getElementById('vis-toggle-label').textContent = `차량 ${i+1} 이미지`;
    _setVisStyle(visBtn, s.visible !== false);
  }
}

function onSlider(type, val) {
  const s = editSlots[activeTab];
  const v = parseFloat(val);
  if (type==='x') { s.x=v; document.getElementById('num-x').value=Math.round(v); }
  if (type==='y') { s.y=v; document.getElementById('num-y').value=Math.round(v); }
  if (type==='s') { s.scale=v; document.getElementById('num-s').value=Math.round(v); }
  if (type==='z') { s.z=parseInt(v); document.getElementById('num-z').value=parseInt(v); }
  renderEditCanvas();
}

async function renderEditCanvas() {
  const ec = document.getElementById('edit-canvas');
  const ctx = ec.getContext('2d');
  ctx.save();
  ctx.scale(SCALE_RATIO, SCALE_RATIO);
  await drawCoverToCtx(ctx, editSlots);
  ctx.restore();

  // 선택된 차량 핸들 표시
  const s = editSlots[activeTab];
  const ex = s.x * SCALE_RATIO;
  const ey = s.y * SCALE_RATIO;
  const BASE_W = 400 * s.scale / 100 * SCALE_RATIO;
  const carImg = cars[activeTab].img;
  const aspect = carImg ? carImg.height/carImg.width : 0.56;
  const BASE_H = BASE_W * aspect;

  ctx.strokeStyle = '#1B5EF7';
  ctx.lineWidth = 2;
  ctx.setLineDash([5,3]);
  ctx.strokeRect(ex - BASE_W/2, ey - BASE_H/2, BASE_W, BASE_H);
  ctx.setLineDash([]);

  // 코너 핸들
  const hs = 8;
  [[ex-BASE_W/2, ey-BASE_H/2],[ex+BASE_W/2, ey-BASE_H/2],
   [ex-BASE_W/2, ey+BASE_H/2],[ex+BASE_W/2, ey+BASE_H/2]].forEach(([hx,hy]) => {
    ctx.fillStyle='#fff'; ctx.fillRect(hx-hs/2,hy-hs/2,hs,hs);
    ctx.strokeStyle='#1B5EF7'; ctx.lineWidth=1.5; ctx.strokeRect(hx-hs/2,hy-hs/2,hs,hs);
  });

  // 차량 번호 레이블
  ctx.fillStyle = '#1B5EF7';
  rr2(ctx, ex-16, ey-BASE_H/2-22, 32, 18, 4); ctx.fill();
  ctx.fillStyle='#fff'; ctx.font='bold 11px sans-serif'; ctx.textAlign='center';
  ctx.fillText('차량'+(activeTab+1), ex, ey-BASE_H/2-9); ctx.textAlign='left';
}

function rr2(ctx,x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y); ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r); ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h); ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r); ctx.quadraticCurveTo(x,y,x+r,y);
  ctx.closePath();
}

function bindDragEvents() {
  const ec = document.getElementById('edit-canvas');
  ec.onmousedown = e => {
    const rect = ec.getBoundingClientRect();
    const mx = (e.clientX - rect.left) / SCALE_RATIO;
    const my = (e.clientY - rect.top) / SCALE_RATIO;
    // 클릭한 위치에 차량 있는지 확인 (z역순 — 앞에 있는 것 우선)
    const sorted = [...editSlots].sort((a,b)=>b.z-a.z);
    for (const s of sorted) {
      const BASE_W = 400 * s.scale/100;
      const carImg = cars[s.cidx].img;
      const aspect = carImg ? carImg.height/carImg.width : 0.56;
      const BASE_H = BASE_W * aspect;
      if (mx >= s.x-BASE_W/2 && mx <= s.x+BASE_W/2 &&
          my >= s.y-BASE_H/2 && my <= s.y+BASE_H/2) {
        const tabIdx = editSlots.findIndex(es => es.cidx===s.cidx);
        selectTab(tabIdx);
        dragState = { cidx: s.cidx, offsetX: mx-s.x, offsetY: my-s.y };
        ec.style.cursor = 'grabbing';
        break;
      }
    }
  };
  ec.onmousemove = e => {
    if (!dragState) return;
    const rect = ec.getBoundingClientRect();
    const mx = (e.clientX - rect.left) / SCALE_RATIO;
    const my = (e.clientY - rect.top) / SCALE_RATIO;
    const s = editSlots.find(es => es.cidx===dragState.cidx);
    s.x = mx - dragState.offsetX;
    s.y = my - dragState.offsetY;
    // 슬라이더 동기화
    document.getElementById('sl-x').value = Math.round(s.x);
    document.getElementById('sl-y').value = Math.round(s.y);
    document.getElementById('num-x').value = Math.round(s.x);
    document.getElementById('num-y').value = Math.round(s.y);
    renderEditCanvas();
  };
  ec.onmouseup = () => { dragState=null; ec.style.cursor='default'; };
  ec.onmouseleave = () => { dragState=null; ec.style.cursor='default'; };

  // 터치 지원
  ec.ontouchstart = e => {
    e.preventDefault();
    const touch = e.touches[0];
    const rect = ec.getBoundingClientRect();
    const mx = (touch.clientX - rect.left) / SCALE_RATIO;
    const my = (touch.clientY - rect.top) / SCALE_RATIO;
    const sorted = [...editSlots].sort((a,b)=>b.z-a.z);
    for (const s of sorted) {
      const BASE_W = 400*s.scale/100;
      const carImg = cars[s.cidx].img;
      const aspect = carImg ? carImg.height/carImg.width : 0.56;
      const BASE_H = BASE_W*aspect;
      if (mx>=s.x-BASE_W/2&&mx<=s.x+BASE_W/2&&my>=s.y-BASE_H/2&&my<=s.y+BASE_H/2) {
        const tabIdx = editSlots.findIndex(es=>es.cidx===s.cidx);
        selectTab(tabIdx);
        dragState={cidx:s.cidx,offsetX:mx-s.x,offsetY:my-s.y};
        break;
      }
    }
  };
  ec.ontouchmove = e => {
    e.preventDefault();
    if(!dragState) return;
    const touch=e.touches[0];
    const rect=ec.getBoundingClientRect();
    const mx=(touch.clientX-rect.left)/SCALE_RATIO;
    const my=(touch.clientY-rect.top)/SCALE_RATIO;
    const s=editSlots.find(es=>es.cidx===dragState.cidx);
    s.x=mx-dragState.offsetX; s.y=my-dragState.offsetY;
    document.getElementById('sl-x').value=Math.round(s.x);
    document.getElementById('sl-y').value=Math.round(s.y);
    document.getElementById('num-x').value=Math.round(s.x);
    document.getElementById('num-y').value=Math.round(s.y);
    renderEditCanvas();
  };
  ec.ontouchend = () => { dragState=null; };
}

function onNumber(type, val) {
  const v = parseFloat(val);
  if (isNaN(v)) return;
  const s = editSlots[activeTab];
  if (type==='x') { s.x=v; document.getElementById('sl-x').value=v; }
  if (type==='y') { s.y=v; document.getElementById('sl-y').value=v; }
  if (type==='s') { s.scale=v; document.getElementById('sl-s').value=v; }
  if (type==='z') { s.z=parseInt(v); document.getElementById('sl-z').value=parseInt(v); }
  renderEditCanvas();
}

function resetPositions() {
  editSlots = DEFAULT_SLOTS.map((s,i) => ({...s, cidx:i}));
  selectTab(activeTab);
  renderEditCanvas();
}

async function applyEdit() {
  coverSlots = editSlots.map(s => ({x:s.x, y:s.y, scale:s.scale, z:s.z, visible:s.visible}));
  closeEditModal();
  await renderAll();
}

/* ── 유틸 ── */
function clone(src) {
  const c=document.createElement('canvas'); c.width=src.width; c.height=src.height;
  c.getContext('2d').drawImage(src,0,0); return c;
}
function dlOne(idx) {
  if(!window._res) { alert('먼저 미리보기 생성을 눌러주세요'); return; }
  const {canvas,label}=window._res[idx];
  const filename = `${(window._period||'카드').replace(/ /g,'_')}_${String(idx+1).padStart(2,'0')}_${label}.png`;
  canvas.toBlob(blob => {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }, 'image/png');
}
function downloadAll() {
  if(!window._res){alert('먼저 미리보기 생성을 눌러주세요');return;}
  window._res.forEach((_,i)=>setTimeout(()=>dlOne(i),i*300));
}

function rr(ctx,x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y); ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r); ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h); ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r); ctx.quadraticCurveTo(x,y,x+r,y);
  ctx.closePath();
}

buildThemeGrid();
buildLayoutGrid();
